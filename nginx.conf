# Redirect non-www to www (Google has chosen www as canonical)
server {
    listen 80;
    server_name powerproviderservices.com;
    return 301 https://www.powerproviderservices.com$request_uri;
}

server {
    listen 80;
    server_name www.powerproviderservices.com _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that is not a real file falls back to index.html
    # (needed for /privacy-policy and other client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
